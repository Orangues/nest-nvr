<h1>nest-nvr</h1>
<p>nest-nvr is a private, single-user application. It lets the owner of a Google Nest device view and record that device's camera feed on their own home server, using the Google Smart Device Management API.</p>
<p>It is not offered to the public and has no other users.</p>
